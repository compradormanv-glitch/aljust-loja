<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL.just Admin</title><link rel="stylesheet" href="admin.css"></head><body><header><div class="logo"><i>AL</i><b>.just</b></div><a href="index.html">Ver loja</a></header><main><section class="card"><h1>Painel Administrativo</h1><p>Cadastre e gerencie os produtos da AL.just.</p><form id="form"><input id="id" type="hidden"><div class="grid"><label>Nome<input id="name" required></label><label>Preço (Kz)<input id="price" type="number" min="0" required></label><label>Categoria<input id="cat"></label><label>Contacto/WhatsApp<input id="contact"></label></div><label>Descrição<textarea id="desc"></textarea></label><label class="upload">🖼️ Escolher imagem do computador<input id="img" type="file" accept="image/*"><small id="imgname">Nenhuma imagem</small></label><img id="preview" hidden><div><button class="primary">💾 Guardar produto</button><button type="button" id="cancel" hidden>Cancelar</button></div></form></section><section class="card"><h2>Produtos cadastrados <span id="count">0</span></h2><div id="list" class="products"></div></section></main><script src="admin.js"></script></body></html>
