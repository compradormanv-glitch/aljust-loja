<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AL.JUST - Painel Administrativo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>AL.JUST</h1><p>Painel Administrativo</p></header>
  <main>
    <section class="panel">
      <h2 id="formTitle">Cadastrar produto</h2>
      <form id="productForm">
        <input type="hidden" id="productId">
        <label>Nome do produto</label>
        <input id="name" required placeholder="Ex.: Computador HP">
        <label>Categoria</label>
        <select id="category" required>
          <option value="">Selecionar</option>
          <option>Informática</option>
          <option>Material escolar</option>
          <option>Material de escritório</option>
          <option>Outros</option>
        </select>
        <label>Preço (Kz)</label>
        <input id="price" type="number" min="0" required>
        <label>Descrição</label>
        <textarea id="description" placeholder="Descrição do produto"></textarea>
        <label>Imagem do computador</label>
        <input id="image" type="file" accept="image/*">
        <img id="preview" class="preview" alt="Pré-visualização">
        <div class="buttons">
          <button type="submit">Guardar produto</button>
          <button type="button" id="cancelEdit" class="secondary">Cancelar edição</button>
        </div>
      </form>
    </section>

    <section>
      <h2>Produtos cadastrados</h2>
      <div id="adminProducts" class="grid"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
