<script>
const SUPABASE_URL='https://myzlvhpvolpekesibvjz.supabase.co';
const SUPABASE_KEY='sb_publishable_INVV9XjLZN9HAeReMGV-5g_OFjXoB0b';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const WA='244926163681';
const PAY={BFA:{label:'BFA',account:'AO06.0000.1556.73.26.3016.1',img:'bfa.png'},BAI:{label:'BAI',account:'AO06.0040.0000.2250.3712.1014.2',img:'bai.png'},EXPRESS:{label:'Multicaixa Express',account:'926 163 681',img:'express.png'}};
let products=[], cart=JSON.parse(localStorage.getItem('aljust_cart')||'[]'), currentProduct=null, selectedPayment='BFA';
const money=n=>new Intl.NumberFormat('pt-AO').format(Number(n||0))+' Kz';
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function parseImages(v){if(!v)return[];try{const a=JSON.parse(v);if(Array.isArray(a)&&a.length)return a.filter(Boolean)}catch{}return [v].filter(Boolean)}
function parseDetails(v){try{const x=JSON.parse(v);if(x&&typeof x==='object')return {text:x.text||'',specs:x.specs||{}}}catch{}return {text:v||'',specs:{}}}
async function loadProducts(){const {data,error}=await sb.from('produtos').select('id,created_at,name,category,price,stock,image_url,description').eq('published',true).order('created_at',{ascending:false});if(error){console.warn(error);const r=await sb.from('produtos').select('id,created_at,name,category,price,stock,image_url,description').order('created_at',{ascending:false});products=r.data||[]}else products=data||[];renderRoute()}
function route(){return location.hash||'#inicio'}
function renderRoute(){const h=route();if(h.startsWith('#produto-')){const id=h.slice(9);currentProduct=products.find(p=>String(p.id)===String(id));renderProductPage()}else if(h==='#checkout')renderCheckout();else if(h==='#fatura')renderInvoice(JSON.parse(sessionStorage.getItem('aljust_last_invoice')||'null'));else renderHome()}
function renderHome(){document.title='Al.just | Loja Online';document.getElementById('app').innerHTML=`<section class="hero" id="inicio"><div><span class="eyebrow">LOJA ONLINE AL.JUST</span><h1>Tecnologia, escritório e educação num só lugar.</h1><p>Encontre produtos para estudar, trabalhar e equipar o seu negócio.</p><a class="btn red" href="#produtos">Ver produtos</a></div><div class="hero-art"><span>💻</span><span>🖨️</span><span>📚</span><span>🖱️</span></div></section><section class="section" id="categorias"><span class="eyebrow">CATEGORIAS</span><h2>Encontre o que precisa</h2><div class="filters"><select id="catFilter"><option value="Todos">Todas as categorias</option><option>Informática</option><option>Escritório</option><option>Escolar</option></select><select id="sortFilter"><option value="new">Mais recentes</option><option value="priceAsc">Preço: menor para maior</option><option value="priceDesc">Preço: maior para menor</option></select></div></section><section class="section" id="produtos"><div style="display:flex;justify-content:space-between;align-items:end;gap:10px"><div><span class="eyebrow">CATÁLOGO</span><h2>Produtos</h2></div><div id="productCount" style="color:var(--muted)"></div></div><div id="grid" class="grid"></div></section><section class="benefits"><div><span>🛡️</span><div><strong>Compra segura</strong><small>Pedido confirmado antes do envio.</small></div></div><div><span>🚚</span><div><strong>Entrega em Angola</strong><small>Combine a entrega com a nossa equipa.</small></div></div><div><span>💬</span><div><strong>Atendimento</strong><small>WhatsApp +244 926 163 681.</small></div></div><div><span>✅</span><div><strong>Qualidade</strong><small>Produtos selecionados para si.</small></div></div></section><section class="section" id="sobre"><span class="eyebrow">SOBRE A AL.JUST</span><h2>Soluções para estudar, trabalhar e crescer.</h2><p>Material informático, de escritório e escolar para empresas e outros clientes.</p></section><section class="section" id="contacto"><span class="eyebrow">CONTACTO</span><h2>Fale com a Al.just</h2><a class="btn blue" href="https://wa.me/${WA}" target="_blank">WhatsApp</a></section>`;
const cat=document.getElementById('catFilter'),sort=document.getElementById('sortFilter');cat.onchange=paintGrid;sort.onchange=paintGrid;paintGrid();
}
function paintGrid(){let rows=[...products];const cat=document.getElementById('catFilter')?.value||'Todos';const q=document.getElementById('searchInput').value.trim().toLowerCase();if(cat!=='Todos')rows=rows.filter(p=>p.category===cat);if(q)rows=rows.filter(p=>`${p.name} ${p.category}`.toLowerCase().includes(q));const sort=document.getElementById('sortFilter')?.value||'new';if(sort==='priceAsc')rows.sort((a,b)=>a.price-b.price);if(sort==='priceDesc')rows.sort((a,b)=>b.price-a.price);document.getElementById('productCount').textContent=`${rows.length} produto(s)`;const g=document.getElementById('grid');if(!rows.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">Nenhum produto encontrado.</div>';return}g.innerHTML=rows.map(p=>{const im=parseImages(p.image_url)[0];return `<article class="card"><a href="#produto-${p.id}" class="media">${im?`<img src="${esc(im)}" alt="${esc(p.name)}">`:'📦'}</a><div class="body"><div class="brandline">${esc(p.category||'Al.just')}</div><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div><div class="stock">${Number(p.stock)>0?`${Number(p.stock)} unidade(s) disponíveis`:'Esgotado'}</div><div class="card-actions"><a class="btn light" href="#produto-${p.id}" style="flex:1;text-align:center">Ver produto</a><button class="btn red" style="flex:1" onclick="addToCart('${p.id}',1)">Adicionar</button></div></div></article>`}).join('')}
function renderProductPage(){const p=currentProduct;if(!p){document.getElementById('app').innerHTML='<div class="empty" style="margin:40px 5%">Produto não encontrado.</div>';return}const imgs=parseImages(p.image_url);const d=parseDetails(p.description);let main=imgs[0]||'';let qty=1;document.title=`${p.name} | Al.just`;document.getElementById('app').innerHTML=`<section class="product-page"><div class="product-shell"><div class="gallery"><div class="thumbs" id="thumbs">${imgs.map((u,i)=>`<button onclick="setMainImage(${i})"><img src="${esc(u)}" alt="Imagem ${i+1}"></button>`).join('')}</div><div class="main-image"><img id="mainProductImg" src="${esc(main)}" alt="${esc(p.name)}" onclick="openLightbox()"></div></div><div class="product-info"><div class="ref">Referência: ${esc(d.specs.referencia||String(p.id))}</div><h1>${esc(p.name)}</h1><div class="brandline">${esc(d.specs.marca||'Al.just')} ${d.specs.modelo?`• ${esc(d.specs.modelo)}`:''}</div><div class="bigprice">${money(p.price)}</div><div>${Number(p.stock)>0?`<span class="stock">${Number(p.stock)} unidade(s) disponíveis</span>`:'<span class="badge" style="background:#fee2e2;color:#991b1b">Esgotado</span>'}</div><div class="qty"><button onclick="changePageQty(-1)">−</button><input id="pageQty" value="1" min="1" type="number"><button onclick="changePageQty(1)">+</button></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn red" onclick="addToCart('${p.id}',Number(document.getElementById('pageQty').value)||1)">Adicionar ao carrinho</button><a class="btn blue" href="#checkout">Finalizar compra</a></div></div></div><div class="tabs"><div class="tab"><h3>Descrição</h3><p style="line-height:1.6;white-space:pre-wrap">${esc(d.text||'Descrição do produto disponível na loja.')}</p></div><div class="tab"><h3>Ficha informativa</h3><div class="specs">${Object.entries(d.specs).filter(([k])=>k!=='referencia').map(([k,v])=>`<div>${esc(k)}</div><div>${esc(v)}</div>`).join('')||'<div>Informações</div><div>Consulte a descrição do produto.</div>'}</div></div></div><div class="section" style="padding-left:0;padding-right:0"><span class="eyebrow">MAIS PRODUTOS</span><h2>Continue a comprar</h2><div class="grid">${products.filter(x=>String(x.id)!==String(p.id)).slice(0,4).map(x=>{const u=parseImages(x.image_url)[0];return `<article class="card"><a href="#produto-${x.id}" class="media"><img src="${esc(u||'')}" alt="${esc(x.name)}"></a><div class="body"><h3>${esc(x.name)}</h3><div class="price">${money(x.price)}</div><a class="btn light" href="#produto-${x.id}">Ver produto</a></div></article>`}).join('')}</div></div></section>`;window._currentImgs=imgs}
function setMainImage(i){const imgs=window._currentImgs||[];if(imgs[i])document.getElementById('mainProductImg').src=imgs[i]}
function openLightbox(){const src=document.getElementById('mainProductImg').src;document.getElementById('lightImg').src=src;document.getElementById('lightbox').classList.add('show')}
function changePageQty(d){const i=document.getElementById('pageQty');i.value=Math.max(1,(Number(i.value)||1)+d)}
function addToCart(id,q){const p=products.find(x=>String(x.id)===String(id));if(!p||p.stock<=0)return alert('Produto sem stock.');const qty=Math.min(Number(q)||1,Number(p.stock));const found=cart.find(x=>String(x.id)===String(id));if(found)found.qty=Math.min(found.qty+qty,Number(p.stock));else cart.push({id:p.id,qty});saveCart();openDrawer()}
function saveCart(){localStorage.setItem('aljust_cart',JSON.stringify(cart));updateCartCount();renderCart()}
function updateCartCount(){document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+Number(x.qty||0),0)}
function renderCart(){const box=document.getElementById('cartItems');if(!box)return;if(!cart.length){box.innerHTML='<div class="empty">O carrinho está vazio.</div>';document.getElementById('cartTotal').textContent='0 Kz';return}let total=0;box.innerHTML=cart.map((c,idx)=>{const p=products.find(x=>String(x.id)===String(c.id));if(!p)return'';const u=parseImages(p.image_url)[0]||'';total+=p.price*c.qty;return `<div class="cart-row"><img src="${esc(u)}"><div><b>${esc(p.name)}</b><div>${money(p.price)}</div><div style="display:flex;gap:6px;margin-top:6px"><button class="light btn" onclick="cartQty(${idx},-1)">−</button><span style="padding:8px 4px">${c.qty}</span><button class="light btn" onclick="cartQty(${idx},1)">+</button></div></div><button class="btn light" onclick="removeCart(${idx})">✕</button></div>`}).join('');document.getElementById('cartTotal').textContent=money(total)}
function cartQty(i,d){const c=cart[i];const p=products.find(x=>String(x.id)===String(c.id));if(!p)return;c.qty=Math.max(1,Math.min(Number(p.stock),c.qty+d));saveCart()}
function removeCart(i){cart.splice(i,1);saveCart()}
function openDrawer(){document.getElementById('drawer').classList.add('show');document.getElementById('overlay').classList.add('show');renderCart()}
function closeDrawer(){document.getElementById('drawer').classList.remove('show');document.getElementById('overlay').classList.remove('show')}
function renderCheckout(){if(!cart.length){document.getElementById('app').innerHTML='<div class="checkout"><h1>Seu carrinho está vazio</h1><a class="btn blue" href="#produtos">Voltar aos produtos</a></div>';return}let total=0;const rows=cart.map(c=>{const p=products.find(x=>String(x.id)===String(c.id));if(!p)return'';total+=p.price*c.qty;return `<div style="display:flex;justify-content:space-between;padding:7px 0"><span>${esc(p.name)} × ${c.qty}</span><b>${money(p.price*c.qty)}</b></div>`}).join('');document.getElementById('app').innerHTML=`<section class="checkout"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><span class="eyebrow">CHECKOUT</span><h1>Finalizar compra</h1></div><a href="#produtos" class="btn light">Continuar a comprar</a></div><div class="notice">Preencha os dados. Para compras empresariais, o NIF é necessário.</div><div class="grid2"><div><label>Nome *</label><input id="cName" required></div><div><label>Telefone/WhatsApp *</label><input id="cPhone" required></div><div><label>Nome da empresa</label><input id="cCompany" placeholder="Opcional se compra pessoal"></div><div><label>NIF</label><input id="cNif" placeholder="NIF da empresa"></div><div class="full"><label>Morada de entrega *</label><input id="cAddress" required></div><div class="full"><label>Observações</label><textarea id="cNotes"></textarea></div></div><h3>Forma de pagamento</h3><div class="pay-grid">${Object.entries(PAY).map(([k,v])=>`<div class="pay-card ${k==='BFA'?'active':''}" data-pay="${k}"><img src="${v.img}" alt="${v.label}"><b>${v.label}</b><div style="font-size:12px;color:var(--muted);margin-top:5px">${v.account}</div></div>`).join('')}</div><div style="margin-top:22px;background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:15px">${rows}<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:10px;font-size:20px"><span>Total</span><b>${money(total)}</b></div></div><button class="btn red" id="confirmOrder" style="width:100%;margin-top:20px">Confirmar pedido e gerar fatura</button></section>`;document.querySelectorAll('.pay-card').forEach(el=>el.onclick=()=>{selectedPayment=el.dataset.pay;document.querySelectorAll('.pay-card').forEach(x=>x.classList.remove('active'));el.classList.add('active')});document.getElementById('confirmOrder').onclick=()=>confirmOrder(total)}
function confirmOrder(total){const name=document.getElementById('cName').value.trim(),phone=document.getElementById('cPhone').value.trim(),company=document.getElementById('cCompany').value.trim(),nif=document.getElementById('cNif').value.trim(),address=document.getElementById('cAddress').value.trim(),notes=document.getElementById('cNotes').value.trim();if(!name||!phone||!address)return alert('Preencha nome, telefone e morada.');if(company&&!nif)return alert('Para compra empresarial, informe o NIF.');const invoice={number:'ALJ-'+Date.now().toString(36).toUpperCase(),date:new Date().toLocaleString('pt-AO'),name,phone,company,nif,address,notes,payment:selectedPayment,account:PAY[selectedPayment].account,total,items:cart.map(c=>{const p=products.find(x=>String(x.id)===String(c.id));return {name:p.name,qty:c.qty,unit:p.price,line:p.price*c.qty}})};sessionStorage.setItem('aljust_last_invoice',JSON.stringify(invoice));const txt=`Pedido ${invoice.number}\nCliente: ${name}${company?`\nEmpresa: ${company}\nNIF: ${nif}`:''}\nPagamento: ${PAY[selectedPayment].label}\nTotal: ${money(total)}\nMorada: ${address}`;cart=[];saveCart();sessionStorage.setItem('aljust_wa_text',txt);location.hash='#fatura'}
function renderInvoice(inv){if(!inv){document.getElementById('app').innerHTML='<div class="empty" style="margin:40px 5%">Nenhuma fatura encontrada.</div>';return}document.getElementById('app').innerHTML=`<section class="invoice"><div class="invoice-head"><div><div style="font-size:30px;font-weight:900;color:var(--red)">Al<span style="color:var(--navy)">.just</span></div><div>Material informático • escritório • escolar</div></div><div><b>Fatura/Resumo</b><div>${esc(inv.number)}</div><div>${esc(inv.date)}</div></div></div><h2>Dados do cliente</h2><div>${esc(inv.name)} • ${esc(inv.phone)}</div>${inv.company?`<div>Empresa: <b>${esc(inv.company)}</b> • NIF: <b>${esc(inv.nif)}</b></div>`:''}<div>Morada: ${esc(inv.address)}</div><h2>Itens</h2><table><thead><tr><th>Produto</th><th>Qtd.</th><th>Preço</th><th>Total</th></tr></thead><tbody>${inv.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.unit)}</td><td>${money(i.line)}</td></tr>`).join('')}</tbody></table><div class="totalline"><span>Total</span><span>${money(inv.total)}</span></div><div class="notice" style="margin-top:18px"><b>Pagamento:</b> ${esc(PAY[inv.payment].label)}<br><b>Referência/Conta:</b> ${esc(inv.account)}</div><div class="actions" style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn blue" onclick="window.print()">Imprimir / Guardar PDF</button><button class="btn red" onclick="sendInvoiceWhatsApp()">Enviar no WhatsApp</button><a class="btn light" href="#inicio">Voltar à loja</a></div></section>`}
function sendInvoiceWhatsApp(){const inv=JSON.parse(sessionStorage.getItem('aljust_last_invoice')||'null');if(!inv)return;const txt=`Fatura/Resumo ${inv.number}\nCliente: ${inv.name}${inv.company?`\nEmpresa: ${inv.company}\nNIF: ${inv.nif}`:''}\nTotal: ${money(inv.total)}\nPagamento: ${PAY[inv.payment].label}\nConta/Referência: ${inv.account}`;window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(txt),'_blank')}
let clicks=0,timer=null;document.getElementById('brandLogo').addEventListener('click',e=>{if(location.hash==='#inicio'||location.hash===''||location.hash==='#produtos'){e.preventDefault();clicks++;clearTimeout(timer);timer=setTimeout(()=>clicks=0,1400);if(clicks>=5){clicks=0;location.href='admin.html'}}});document.getElementById('searchInput').addEventListener('input',()=>{if(document.getElementById('grid'))paintGrid()});document.getElementById('searchBtn').onclick=()=>{if(!document.getElementById('grid'))location.hash='#produtos';else paintGrid()};document.getElementById('openCart').onclick=openDrawer;document.getElementById('closeCart').onclick=closeDrawer;document.getElementById('overlay').onclick=closeDrawer;document.getElementById('checkoutFromCart').onclick=()=>{closeDrawer();location.hash='#checkout'};document.getElementById('closeLight').onclick=()=>document.getElementById('lightbox').classList.remove('show');window.addEventListener('hashchange',renderRoute);updateCartCount();renderCart();loadProducts();
</script>
</body></html>
